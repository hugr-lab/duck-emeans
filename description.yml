extension:
  name: emeans
  description: e-means clustering, mini-batch k-means with EMA updates and fitted scaling laws (Bessa et al. 2026)
  version: 0.0.1
  language: C
  build: cmake
  license: MIT
  requires_toolchains: "python3"
  maintainers:
    - oluies

repo:
  github: hugr-lab/duck-emeans
  ref: main

docs:
  hello_world: |
    LOAD emeans;

    -- Two unit squares; each centroid ends at the mean of its square's four corners
    SELECT list_sort((emeans([[0, 0], [0, 1], [1, 0], [1, 1],
                              [10, 10], [10, 11], [11, 10], [11, 11]], 2)).centroids);
    -- [[0.5, 0.5], [10.5, 10.5]]

    -- The nearest centroid of one vector, 1-based, and the squared distance to it
    SELECT emeans_assign([9, 9], [[0, 0], [10, 10]]);
    -- {'label': 2, 'sq_distance': 2.0}
  extended_description: |
    e-means (Bessa et al. 2026, arXiv 2611.09501) is mini-batch k-means whose centroids follow an
    exponential moving average of their batch means, with the batch size and step set by fitted
    scaling laws. The paper reports Lloyd's 25-epoch loss beaten in 1.4 to 2.6 epochs.

    - emeans(vectors, k [, nepochs [, seed]]): centroids, 1-based labels, objective per pass.
    - emeans_assign(vector, centroids): the nearest centroid and the squared distance.
    - emeans_recipe(n, k, d, nepochs): the batch size and step the scaling laws pick.

    Vectors are FLOAT, DOUBLE or integer lists, or fixed-size arrays such as FLOAT[384]. A running call
    cannot be interrupted, so SET emeans_max_work bounds the work of one call (rows x k x d over all
    passes, default 1e11).
    Documentation: https://github.com/hugr-lab/duck-emeans
