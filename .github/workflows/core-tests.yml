#
# Numerical core under ASan/UBSan and ThreadSanitizer, the CRAP gate over every C and C++ function, and
# the comparison with the reference e-means in faiss-cpu and the interrupt test. The last two jobs build DuckDB from
# the submodule. The SQL tests (test/sql, among them the memory_limit and max_execution_time tests) run in the
# distribution pipeline and in the CRAP job.
#
name: Core tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  core:
    name: test_core (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20   # ASan can hang at startup on some macOS releases; fail instead of waiting 6 h
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive   # the Makefile includes extension-ci-tools makefiles
      - run: make test_core
      - run: make test_threads

  crap:
    name: CRAP < 10 for every C and C++ function
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: astral-sh/setup-uv@v6
      - uses: seanmiddleditch/gha-setup-ninja@v6
      - run: make crap

  compare_faiss:
    name: against faiss-cpu NumpyEmeans
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: astral-sh/setup-uv@v6
      - uses: seanmiddleditch/gha-setup-ninja@v6
      - run: GEN=ninja make compare_faiss
      # emeans_stream stops on con.interrupt(), also while a spilled pass sorts (the release is built already).
      - run: GEN=ninja make test_interrupt

  web:
    name: browser demos (npm test, Scala.js tests)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: npm test
      - run: make -C web/playground test
