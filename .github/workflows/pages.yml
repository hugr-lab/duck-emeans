#
# GitHub Pages, https://hugr-lab.github.io/duck-emeans/:
#   /                        the documentation site (website/, Docusaurus)
#   /demo/                   the browser demos: index.html (plain JavaScript) and playground.html (Scala.js and
#                            Laminar, built here with Mill), with the WASM build of the extension
#   /playground.html         a redirect to /demo/playground.html, where the playground was before the docs
# Runs after every successful distribution pipeline on main, taking the wasm_eh build from that run, or by
# hand (the latest such run).
#
# Only the build of main's current head is deployed. When several merges land close together, their
# distribution runs can finish out of order, and the site must not go back to an older build because its
# run finished last: a run for an older commit is skipped, and the newer commit's own run deploys. The
# deploy job checks again, since main can move while the site is being built.
#
name: Pages
on:
  workflow_run:
    workflows: ["Main Extension Distribution Pipeline"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  check:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      latest: ${{ steps.head.outputs.latest }}
    steps:
      - name: Is the build from main's current head?
        id: head
        env:
          GH_TOKEN: ${{ github.token }}
          BUILT: ${{ github.event.workflow_run.head_sha }}
        run: |
          HEAD=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
          if [ -z "$BUILT" ] || [ "$BUILT" = "$HEAD" ]; then
            echo "latest=true" >> "$GITHUB_OUTPUT"
          else
            echo "latest=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipped: this build is of $BUILT, main is at $HEAD; that commit's run deploys."
          fi

  build:
    needs: check
    if: needs.check.outputs.latest == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Find the distribution run
        id: run
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          if [ -z "$RUN_ID" ]; then
            RUN_ID=$(gh run list -R "$GITHUB_REPOSITORY" --workflow MainDistributionPipeline.yml --branch main \
              --status success --limit 1 --json databaseId -q '.[0].databaseId')
          fi
          echo "id=$RUN_ID" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          name: emeans-v2.0.0-extension-wasm_eh
          run-id: ${{ steps.run.outputs.id }}
          github-token: ${{ github.token }}
          path: wasm
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: npm test
      - run: make -C web/playground test
      - name: Assemble the demos
        run: make -C web/playground dist WASM="$GITHUB_WORKSPACE/wasm/emeans.duckdb_extension.wasm"
      - name: Build the docs site
        working-directory: website
        run: |
          npm ci
          npx docusaurus build
      - name: Assemble the site
        run: |
          mkdir -p _site/demo
          cp -r website/build/. _site/
          cp -r web/playground/dist/. _site/demo/
          ls -l _site _site/demo
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Is the build still from main's current head?
        id: head
        env:
          GH_TOKEN: ${{ github.token }}
          BUILT: ${{ github.event.workflow_run.head_sha }}
        run: |
          HEAD=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
          if [ -n "$BUILT" ] && [ "$BUILT" != "$HEAD" ]; then
            echo "::notice::Not deployed: main moved to $HEAD while $BUILT was being built; that commit's run deploys."
            echo "latest=false" >> "$GITHUB_OUTPUT"
          else
            echo "latest=true" >> "$GITHUB_OUTPUT"
          fi
      - id: deployment
        if: steps.head.outputs.latest == 'true'
        uses: actions/deploy-pages@v4
